<!DOCTYPE html>
<html>

<head>
  <meta charset='utf-8'>
  <title>Clients</title>
  <link rel='stylesheet' href='css/style.css'>
  <script src='js/seed.js'></script>
  <script src='js/auth.js'></script>
  <script src='js/data.js'></script>
  <script>const active = h => document.querySelectorAll('.sidebar a').forEach(a => a.getAttribute('href') === h && a.classList.add('active'));</script>
  <script>
    function render() {
      rows.innerHTML = clients().map((c, i) => `<tr><td>${c.name}</td><td>${c.api}</td><td class='status ${c.status}'>${c.status}</td>
<td><button class='btn btn-alt' onclick='del(${i})'>Delete</button></td></tr>`).join('');
    }
    function add(e) { e.preventDefault(); if (!n.value || !a.value) return; const arr = clients(); arr.push({ name: n.value, api: a.value, status: 'Active' }); setClients(arr); n.value = a.value = ''; render(); }
    function del(i) { const arr = clients(); arr.splice(i, 1); setClients(arr); render(); }
    document.addEventListener('DOMContentLoaded', render);
  </script>
</head>

<body onload="guard();active('clients.html')">
  <div class='container'>
    <div class='sidebar'>
      <h1>Notso AI</h1><a href='dashboard.html'>Dashboard</a>
      <a href='clients.html'>Clients</a>
      <a href='users.html'>Users</a>
      <a href='settings.html'>Settings</a>
      <a href='profile.html'>Profile</a><a href='javascript:logout()' style='margin-top:auto'>Logout</a>
    </div>
    <div class='main'>
      <h2>Clients</h2>
      <form onsubmit='add(event)' class='row'>
        <div><input id='n' placeholder='Name'></div>
        <div><input id='a' placeholder='API URL'></div>
        <div><button class='btn'>Add</button></div>
      </form>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>API</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id='rows'></tbody>
      </table>
    </div>
  </div>
</body>

</html>
