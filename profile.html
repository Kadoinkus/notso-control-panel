<!DOCTYPE html><html><head><meta charset='utf-8'><title>Profile</title>
<link rel='stylesheet' href='css/style.css'><script src='js/seed.js'></script>
<script src='js/auth.js'></script><script src='js/data.js'></script><script>const active=h=>document.querySelectorAll('.sidebar a').forEach(a=>a.getAttribute('href')===h&&a.classList.add('active'));</script><script>
const me=JSON.parse(sessionStorage.me||'{}');document.addEventListener('DOMContentLoaded',()=>{pe.value=me.email||'';pr.value=me.role||'';});
function saveP(e){e.preventDefault();if(!np.value)return;let arr=users();const idx=arr.findIndex(u=>u.email===me.email);arr[idx].password=np.value;setUsers(arr);msg.textContent='Saved!';}
</script></head>
<body onload="guard();active('profile.html')"><div class='container'>
<div class='sidebar'><h1>Notso AI</h1><a href='dashboard.html'>Dashboard</a>
  <a href='clients.html'>Clients</a>
  <a href='users.html'>Users</a>
  <a href='settings.html'>Settings</a>
  <a href='profile.html'>Profile</a><a href='javascript:logout()' style='margin-top:auto'>Logout</a></div>
<div class='main'><h2>Profile</h2><div class='card' style='max-width:460px'><form onsubmit='saveP(event)'><div class='row'>
<div><label>Email</label><input id='pe' readonly></div><div><label>Role</label><input id='pr' readonly></div></div>
<label style='margin-top:16px'>New password</label><input id='np'><button class='btn' style='margin-top:20px'>Save</button><div id='msg' style='margin-top:10px'></div></form></div></div></div></body></html>
