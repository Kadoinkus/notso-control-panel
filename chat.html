<!DOCTYPE html>
<html>

<head>
  <meta charset='utf-8'>
  <title>Chat</title>
  <link rel='stylesheet' href='css/style.css'>
  <script src='js/seed.js'></script>
  <script src='js/auth.js'></script>
  <script src='js/data.js'></script>
  <script>const active = h => document.querySelectorAll('.sidebar a').forEach(a => a.getAttribute('href') === h && a.classList.add('active'));</script>
  <script>
    const id = new URLSearchParams(location.search).get('session') || '001';
    const metaRec = meta('Jumbo').find(x => x.id === id);
    title.textContent = `Chat — ${id}${metaRec ? ' (' + metaRec.timestamp + ' ' + metaRec.time + ')' : ''}`;
    document.addEventListener('DOMContentLoaded', () => { conv.innerHTML = chat(id).map(m => `<div class='chat-bubble ${m.sender === 'user' ? 'chat-user' : 'chat-bot'}'>${m.text}</div>`).join(''); });
  </script>
</head>

<body onload="guard();active('chat.html')">
  <div class='container'>
    <div class='sidebar'>
      <h1>Notso AI</h1><a href='dashboard.html'>Dashboard</a>
      <a href='clients.html'>Clients</a>
      <a href='users.html'>Users</a>
      <a href='settings.html'>Settings</a>
      <a href='profile.html'>Profile</a><a href='javascript:logout()' style='margin-top:auto'>Logout</a>
    </div>
    <div class='main'>
      <h2 id='title'></h2><a class='btn btn-alt' href='javascript:history.back()'>Go back</a>
      <div id='conv' style='margin-top:20px'></div>
    </div>
  </div>
</body>

</html>
